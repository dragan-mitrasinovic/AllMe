# Production stack. Only the frontend is public: its nginx serves the Angular app and proxies /api/* to the
# backend, so everything runs on one origin. Backend and face-service are reachable only inside this network.
# Resource limits are generous but keep AllMe from starving other apps on the shared server: face matching
# gets up to 2 CPUs (two worker processes) and 3 GB; big searches take longer rather than using more.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BUILD_CONFIGURATION: production
    expose:
      - "8080"
    depends_on:
      - backend
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    logging: &logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DOCKER_ENV=true
      - FACE_SERVICE_URL=http://face-service:8081
      - DOMAIN=${DOMAIN}
      - FRONTEND_URL=https://${DOMAIN}
      - ONEDRIVE_CLIENT_ID=${ONEDRIVE_CLIENT_ID}
      - ONEDRIVE_CLIENT_SECRET=${ONEDRIVE_CLIENT_SECRET}
      - ONEDRIVE_REDIRECT_URI=${ONEDRIVE_REDIRECT_URI}
      - GOOGLEDRIVE_CLIENT_ID=${GOOGLEDRIVE_CLIENT_ID}
      - GOOGLEDRIVE_CLIENT_SECRET=${GOOGLEDRIVE_CLIENT_SECRET}
      - GOOGLEDRIVE_REDIRECT_URI=${GOOGLEDRIVE_REDIRECT_URI}
    depends_on:
      - face-service
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    logging: *logging

  face-service:
    build:
      context: ./face-service
      dockerfile: Dockerfile
    expose:
      - "8081"
    environment:
      - FACE_WORKERS=2
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 3g
    logging: *logging
